name: Simulation data (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - run: python scripts/fetch_sim_data.py
      - name: Push to sim-data branch (not main)
        run: |
          mkdir -p /tmp/out && mv sim_prices.json /tmp/out/
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan sim-data
          git rm -rq --cached . && rm -rf ./* .github 2>/dev/null || true
          cp /tmp/out/sim_prices.json .
          git add sim_prices.json
          git commit -qm "sim data $(date -u +%F)"
          git push -f origin sim-data

const { useState, useRef, useEffect } = React;

function ROEChart({ chartData, activeTab }) {
  const canvasRef = useRef(null);
  const chartInstanceRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartInstanceRef.current) chartInstanceRef.current.destroy();

    const palette = { Bear: '#f87171', Base: '#60a5fa', Bull: '#4ade80' };
    chartInstanceRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'line',
      data: {
        labels: chartData.map(function(r){ return r.year; }),
        datasets: ['Bear', 'Base', 'Bull'].map(function(key){
          return {
            label: key,
            data: chartData.map(function(r){ return r[key]; }),
            borderColor: palette[key],
            backgroundColor: palette[key],
            borderWidth: activeTab === key ? 3 : 1.5,
            pointRadius: activeTab === key ? 5 : 3,
            opacity: activeTab === key ? 1 : 0.35,
          };
        }),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#94a3b8', font: { size: 11 } } },
          tooltip: { callbacks: { label: function(ctx){ return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%'; } } },
        },
        scales: {
          x: { ticks: { color: '#475569', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { min: 6, max: 40, ticks: { color: '#475569', font: { size: 9 }, callback: function(v){ return v + '%'; } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        },
      },
    });

    return function cleanup(){ if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
  }, [activeTab]);

  return <canvas ref={canvasRef}></canvas>;
}

const CHART = [
  { year: "FY25",  Bear: 35.7, Base: 35.7, Bull: 35.7 },
  { year: "FY26E", Bear: 27.6, Base: 27.6, Bull: 27.6 },
  { year: "FY27F", Bear: 24.2, Base: 24.2, Bull: 24.2 },
  { year: "FY28F", Bear: 21.5, Base: 21.5, Bull: 21.5 },
  { year: "FY29F", Bear: 14.0, Base: 20.0, Bull: 27.0 },
  { year: "FY30F", Bear: 10.0, Base: 19.0, Bull: 29.0 },
];

function calcAvg(key) {
  var vals = CHART.slice(1).map(function(r) { return r[key]; });
  return (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1);
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TP TRACKER</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* 레이아웃: 한 열 모바일 우선 — 요약 → 시장 탭 → 정렬 → 종목 카드(접힘=핵심, 펼침=상세) */
  :root{
    --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#e1e5eb;
    --fg:#141a22; --muted:#566170; --faint:#8b94a1;
    --accent:#1f6f5c; --accent-soft:#e3f1ec;
    --up:#d6333a; --down:#2f6fe0;
    --ok:#1d8a5a; --ok-soft:#e4f4ec; --warn:#a96a12; --warn-soft:#fbf0dc; --bad:#c62f36; --bad-soft:#fde8e8;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1115; --surface:#171b21; --surface-2:#1f242c; --line:#2a3039;
    --fg:#e9edf2; --muted:#a6b0bc; --faint:#717c89;
    --accent:#4fb79f; --accent-soft:#16302a;
    --up:#ff5f64; --down:#5d9cff;
    --ok:#43c08a; --ok-soft:#15302a; --warn:#e5a845; --warn-soft:#352a17; --bad:#ff6b70; --bad-soft:#3a1d20;
    color-scheme: dark; } }
  :root[data-theme="dark"]{
    --bg:#0e1115; --surface:#171b21; --surface-2:#1f242c; --line:#2a3039;
    --fg:#e9edf2; --muted:#a6b0bc; --faint:#717c89;
    --accent:#4fb79f; --accent-soft:#16302a;
    --up:#ff5f64; --down:#5d9cff;
    --ok:#43c08a; --ok-soft:#15302a; --warn:#e5a845; --warn-soft:#352a17; --bad:#ff6b70; --bad-soft:#3a1d20;
    color-scheme: dark; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .wrap{ max-width:680px; margin:0 auto; padding-inline:16px; padding-block:calc(16px + env(safe-area-inset-top,0px)) 56px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  .summary, .panel.active, .board, .card summary, .detail, .box{ grid-template-columns:minmax(0,1fr); }
  .detail > *, .hrow > div, .kv > div, .sum-item > *{ min-width:0; overflow-wrap:anywhere; }
  .num{ font-variant-numeric:tabular-nums; }
  button, select{ font-family:inherit; font-size:15px; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .up{ color:var(--up); } .down{ color:var(--down); }

  /* 헤더 */
  .top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand{ font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .brand span{ color:var(--accent); }
  .asof{ font-size:13px; color:var(--faint); }
  .top-r{ display:flex; align-items:center; gap:8px; margin-left:auto; }
  .refresh{ min-height:44px; display:inline-flex; align-items:center; gap:6px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--fg); font-weight:600; font-size:14px; cursor:pointer; }
  .refresh .ic{ font-size:17px; line-height:1; display:inline-block; }
  .refresh.busy .ic{ animation:spin .8s linear infinite; }
  .refresh:disabled{ opacity:.7; cursor:default; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; z-index:10; max-width:calc(100% - 32px); text-align:center; }

  /* 요약 */
  .summary{ background:var(--surface); border-radius:16px; padding:18px; display:grid; gap:16px; }
  .sum-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat .k{ font-size:13px; color:var(--muted); }
  .stat .v{ font-size:24px; font-weight:700; line-height:1.25; }
  .stat .v small{ font-size:14px; font-weight:500; color:var(--muted); margin-left:2px; }
  .sum-group{ display:grid; gap:8px; }
  .sum-title{ font-size:14px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .sum-list{ display:grid; gap:6px; }
  .sum-item{ display:grid; gap:2px; min-height:44px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:0; width:100%; text-align:left; cursor:pointer; }
  .sum-item .n{ font-weight:700; font-size:15px; }
  .sum-item .r{ font-size:13.5px; color:var(--muted); font-weight:600; }
  .sum-item.bad{ background:var(--bad-soft); } .sum-item.bad .r{ color:var(--bad); }
  .sum-item.warn{ background:var(--warn-soft); } .sum-item.warn .r{ color:var(--warn); }
  .sum-item.ok{ background:var(--ok-soft); } .sum-item.ok .r{ color:var(--ok); }
  .sum-empty{ font-size:14px; color:var(--faint); }
  .sum-foot{ font-size:13px; color:var(--muted); }

  /* 시장 탭 */
  .tabs{ display:grid; grid-template-columns:repeat(5,1fr); gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; }
  .tab{ min-height:44px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer; padding:0 2px; font-size:14.5px; white-space:nowrap; }
  .tab.active{ background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .panel{ display:none; gap:12px; }
  .panel.active{ display:grid; }

  /* 지수 + 정렬 */
  .indices{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .indices::-webkit-scrollbar{ display:none; }
  .idx{ flex:1 0 auto; min-width:104px; background:var(--surface); border-radius:12px; padding:10px 12px; }
  .idx .k{ font-size:12px; color:var(--muted); }
  .idx .v{ font-size:16px; font-weight:700; }
  .idx .c{ font-size:13px; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .controls label{ font-size:14px; color:var(--muted); }
  .sel{ min-height:44px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:0 12px; }
  .ghost{ min-height:44px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:0 14px; cursor:pointer; color:var(--muted); }
  .controls .grow{ flex:1; }
  .group-h{ display:flex; justify-content:space-between; font-size:14px; color:var(--muted); font-weight:600; padding:6px 2px 0; }

  /* 종목 카드 */
  .board{ display:grid; gap:10px; }
  .card{ background:var(--surface); border-radius:16px; overflow:hidden; scroll-margin-top:12px; }
  .card summary{ list-style:none; cursor:pointer; padding:16px 16px 14px; display:grid; gap:12px; }
  .card summary::-webkit-details-marker{ display:none; }
  .c-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .c-name{ font-size:17px; font-weight:700; line-height:1.3; }
  .c-badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .badge{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
  .badge.watch{ background:var(--warn-soft); color:var(--warn); }
  .chev{ width:28px; height:28px; display:grid; place-items:center; color:var(--faint); flex:none; transition:transform .15s; }
  .card[open] .chev{ transform:rotate(180deg); }
  .c-prices{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .c-price{ font-size:28px; font-weight:800; line-height:1.1; letter-spacing:-.01em; }
  .c-chg{ font-size:14px; font-weight:600; margin-top:4px; }
  .c-tp{ text-align:right; }
  .c-tp .k{ font-size:13px; color:var(--muted); }
  .c-tp .v{ font-size:17px; font-weight:700; }
  .c-tp .g{ font-size:14px; font-weight:600; color:var(--accent); }
  .c-tp .g.done{ color:var(--ok); }
  .prog{ display:grid; gap:6px; }
  .prog-top{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); gap:8px; }
  .prog-top b{ color:var(--fg); font-weight:700; }
  .prog-top b.over{ color:var(--ok); } .prog-top b.under{ color:var(--down); }
  .bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:999px; background:var(--accent); }
  .bar.under i{ background:var(--down); }
  .bar.over i{ background:var(--ok); }
  .thesis{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; padding:8px 10px; border-radius:10px; background:var(--surface-2); }
  .thesis .st{ font-weight:700; }
  .thesis.ok .st{ color:var(--ok); } .thesis.warn .st{ color:var(--warn); } .thesis.bad .st{ color:var(--bad); }
  .thesis.bad{ background:var(--bad-soft); } .thesis.warn{ background:var(--warn-soft); }
  .thesis .nx{ color:var(--muted); }
  .thesis.none{ color:var(--faint); }
  .ret{ font-size:14px; color:var(--muted); }

  /* 상세 */
  .detail{ padding:4px 16px 18px; display:grid; gap:18px; border-top:1px solid var(--line); }
  .sec-t{ font-size:14px; font-weight:700; color:var(--muted); margin-bottom:8px; }
  .kv{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px; }
  .kv .k{ font-size:13px; color:var(--muted); }
  .kv .v{ font-size:16px; font-weight:600; }
  .note{ font-size:15px; line-height:1.65; color:var(--fg); white-space:pre-line; }
  .note.empty{ color:var(--faint); }
  .scen{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .scen div{ background:var(--surface-2); border-radius:10px; padding:10px; text-align:center; }
  .scen .k{ font-size:12px; color:var(--muted); font-weight:600; }
  .scen .v{ font-size:14px; font-weight:700; white-space:nowrap; overflow-wrap:normal; }
  .scen div{ min-width:0; overflow:hidden; }
  .scen .p{ font-size:13px; color:var(--muted); }
  .tpline{ position:relative; height:6px; border-radius:999px; background:var(--surface-2); margin:28px 6px 40px; }
  .tpline .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); opacity:.55; }
  .tpline .m{ position:absolute; top:-5px; width:2px; height:16px; background:var(--faint); }
  .tpline .m span{ position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:11.5px; color:var(--muted); white-space:nowrap; text-align:center; line-height:1.25; }
  .tpline .m.tp{ background:var(--accent); } .tpline .m.tp span{ color:var(--accent); font-weight:700; }
  .tpline .now{ position:absolute; top:-6px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--fg); border:3px solid var(--surface); }
  .tpline .now span{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:11.5px; font-weight:700; white-space:nowrap; }
  .tpline .edge-l span{ left:0; transform:none; text-align:left; } .tpline .edge-r span{ left:auto; right:0; transform:none; text-align:right; }
  .hlist{ display:grid; gap:8px; }
  .hrow{ display:grid; grid-template-columns:auto 1fr; gap:10px; font-size:14px; align-items:start; }
  .hrow .tag{ font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .tag.ok{ background:var(--ok-soft); color:var(--ok); } .tag.bad{ background:var(--bad-soft); color:var(--bad); } .tag.pend{ background:var(--surface-2); color:var(--muted); }
  .hrow .w{ color:var(--muted); font-size:13px; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--fg); font-weight:600; font-size:15px; text-decoration:none; cursor:pointer; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .frame-wrap{ display:none; margin-top:10px; }
  .frame-wrap iframe{ width:100%; height:640px; border:1px solid var(--line); border-radius:10px; display:block; background:#fff; }
  .frame-wrap.tall iframe{ height:900px; }
  .muted{ color:var(--muted); font-size:14px; }

  /* 적립비교 */
  .box{ background:var(--surface); border-radius:16px; padding:16px; display:grid; gap:12px; }
  .cmp{ font-size:15px; line-height:1.6; }
  .cmp b{ font-weight:800; }
  .seg{ display:inline-grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; }
  .seg button{ min-height:40px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-weight:600; padding:0 12px; cursor:pointer; }
  .seg button.active{ background:var(--surface); color:var(--fg); }
  .chart-wrap{ position:relative; height:240px; }
  .plog{ display:grid; gap:0; font-size:14px; }
  .plog .r{ display:grid; grid-template-columns:62px 1fr 44px 1fr; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .plog .r:last-child{ border-bottom:0; }
  .plog .r.h{ color:var(--muted); font-size:13px; }
  .plog .r span:nth-child(n+2){ text-align:right; }

  .band{ display:inline-block; font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
  .band.great,.band.good{ background:var(--ok-soft); color:var(--ok); }
  .band.bad{ background:var(--bad-soft); color:var(--bad); }
  .empty{ background:var(--surface); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); font-size:15px; }
  .err{ background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:14px; }


  /* 가설 일정 */
  .cal{ background:var(--surface); border-radius:16px; padding:14px; display:grid; gap:10px; }
  .cal-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cal-head b{ font-size:17px; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{ width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:18px; color:var(--muted); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; text-align:center; }
  .cal-grid .wd{ font-size:12px; color:var(--faint); padding:4px 0; }
  .cal-grid .wd:first-child{ color:var(--up); } .cal-grid .wd:last-child{ color:var(--down); }
  .day{ min-height:44px; border:0; background:transparent; border-radius:10px; display:grid; align-content:center; justify-items:center; gap:3px; font-size:15px; color:var(--fg); font-variant-numeric:tabular-nums; padding:4px 0; }
  .day.out{ visibility:hidden; }
  .day.today{ background:var(--surface-2); font-weight:800; }
  .day.has{ cursor:pointer; font-weight:700; }
  .day.has:hover{ background:var(--surface-2); }
  .dots{ display:flex; gap:2px; height:6px; }
  .dots i{ width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .dots i.gate{ background:var(--warn); }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block; }
  .legend i.gate{ background:var(--warn); }
  .agenda{ display:grid; gap:14px; }
  .ag-group{ display:grid; gap:8px; }
  .ag-title{ font-size:15px; font-weight:800; display:flex; justify-content:space-between; align-items:baseline; padding:0 2px; }
  .ag-title span{ font-size:13px; font-weight:600; color:var(--muted); }
  .ag-title.overdue{ color:var(--bad); }
  .ag-day{ background:var(--surface); border-radius:14px; padding:12px 14px; display:grid; gap:10px; scroll-margin-top:12px; }
  .ag-day.flash{ outline:2px solid var(--accent); }
  .ag-date{ display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:15px; }
  .ag-date .dd{ font-size:13px; font-weight:700; color:var(--accent); }
  .ag-date .dd.near{ color:var(--warn); }
  .ag-date .dd.over{ color:var(--bad); }
  .ev{ display:grid; gap:3px; text-decoration:none; color:inherit; padding:10px 12px; border-radius:10px; background:var(--surface-2); min-height:44px; }
  .ev .t1{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:13.5px; color:var(--muted); font-weight:700; }
  .ev .t2{ font-size:15px; font-weight:600; line-height:1.4; }
  .ev .t3{ font-size:13px; color:var(--muted); }
  .kind{ font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--surface); color:var(--muted); }
  .kind.confirmed{ background:var(--ok-soft); color:var(--ok); }
  .kind.deadline{ background:var(--warn-soft); color:var(--warn); }
  .gatebadge{ font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--warn-soft); color:var(--warn); }
  .past summary{ list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:700; color:var(--muted); padding:0 2px; }
  .past summary::-webkit-details-marker{ display:none; }
  .past[open] summary{ margin-bottom:8px; }

  @media (max-width:380px){ .sum-stats .v{ font-size:21px; } .c-price{ font-size:25px; } .scen{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand"><span>TP</span> TRACKER</div>
    <div class="top-r">
      <div class="asof" id="asof" aria-live="polite">시세 불러오는 중…</div>
      <button type="button" class="refresh" id="refreshBtn" aria-label="시세 새로고침"><span class="ic" aria-hidden="true">↻</span><span class="lb">새로고침</span></button>
    </div>
  </header>

  <section class="summary" id="summary" aria-label="투자 현황">
    <div class="sum-stats">
      <div class="stat"><div class="k">관리 종목</div><div class="v num">-</div></div>
      <div class="stat"><div class="k">수익 / 손실</div><div class="v num">-</div></div>
      <div class="stat"><div class="k">가설 붕괴</div><div class="v num">-</div></div>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="분류">
    <button class="tab active" role="tab" data-tab="domestic">국내</button>
    <button class="tab" role="tab" data-tab="overseas">해외</button>
    <button class="tab" role="tab" data-tab="schedule">일정</button>
    <button class="tab" role="tab" data-tab="dca">적립비교</button>
    <button class="tab" role="tab" data-tab="closed">매도완료</button>
  </nav>

  <section class="panel active" data-panel="domestic">
    <div class="indices" id="domesticIndices">
      <div class="idx" data-index="KOSPI"><div class="k">KOSPI</div><div class="v num">-</div><div class="c num">-</div></div>
      <div class="idx" data-index="KOSDAQ"><div class="k">KOSDAQ</div><div class="v num">-</div><div class="c num">-</div></div>
    </div>
    <div class="controls" data-scope="domestic">
            <select class="sel grow" id="sort-domestic" data-scope="domestic" aria-label="정렬">
        <option value="default">정렬: 기본순</option>
        <option value="daily">오늘 등락순</option>
        <option value="goal">목표가 진행률순</option>
        <option value="progress">BULL TP 진행률순</option>
      </select>
      <button type="button" class="ghost expand-all">펼치기</button>
      <button type="button" class="ghost collapse-all">접기</button>
    </div>
    <div id="board-domestic"></div>
  </section>

  <section class="panel" data-panel="overseas">
    <div class="indices" id="overseasIndices">
      <div class="idx" data-index="SPX"><div class="k">S&amp;P 500</div><div class="v num">-</div><div class="c num">-</div></div>
      <div class="idx" data-index="NASDAQ"><div class="k">NASDAQ</div><div class="v num">-</div><div class="c num">-</div></div>

const SOON_DAYS = 14;        // 판정 임박 기준 (일)

/* ---------- 기존 계산 함수 (변경 없음) ---------- */
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtPrice(stock, n){
  return stock.currency === 'USD'
    ? '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : fmt(n) + '원';
}
function currentPriceForStock(stock){
  if (latestPriceData && latestPriceData.stocks && latestPriceData.stocks[stock.code]) {
    return latestPriceData.stocks[stock.code].price;
  }
  return stock.entry;
}
function pos(stock, value){
  if (!stock.entry || !stock.bullTP) return 0;
  const range = stock.bullTP - stock.entry;
  if (range <= 0) return 0;
  return Math.max(0, Math.min(100, ((value - stock.entry) / range) * 100));
}
function short(value, currency){
  if (currency === 'USD') return '$' + value.toLocaleString('en-US');
  return (value/10000).toFixed(0) + '만';
}
function tpGapInfo(stock, currentPrice){
  if (stock.finalTP == null || currentPrice == null) return null;
  const diff = stock.finalTP - currentPrice;
  const pct = (diff / currentPrice) * 100;
  if (diff > 0){
    return { text: `TP까지 +${fmtPrice(stock, diff)} (+${pct.toFixed(1)}%)`, achieved: false, pct };
  }
  return { text: `TP 달성! 초과 +${fmtPrice(stock, Math.abs(diff))} (+${Math.abs(pct).toFixed(1)}%)`, achieved: true, pct };
}
function tpBandInfo(stock){
  const { entry, exit, bearTP, baseTP, bullTP } = stock;
  const pctReturn = ((exit - entry) / entry) * 100;
  if (bearTP == null || baseTP == null || bullTP == null){
    return { bandText: null, pctReturn };
  }
  let bandText, tone;
  if (exit < bearTP){ bandText = 'BEAR TP 미만에서 매도'; tone = 'bad'; }
  else if (exit < baseTP){ bandText = 'BEAR~BASE 구간에서 매도'; tone = 'neutral'; }
  else if (exit < bullTP){ bandText = 'BASE~BULL 구간에서 매도'; tone = 'good'; }
  else { bandText = 'BULL TP 초과해서 매도'; tone = 'great'; }
  return { bandText, tone, pctReturn };
}
function computeDcaStats(plan){
  const totalShares = plan.purchases.reduce((s,p) => s + p.shares, 0);
  const totalCost = plan.purchases.reduce((s,p) => s + p.shares * p.price, 0);
  const avgPrice = totalCost / totalShares;
  const live = latestPriceData && latestPriceData.stocks && latestPriceData.stocks[plan.code];
  const currentPrice = live ? live.price : avgPrice;
  const evalAmount = currentPrice * totalShares;
  const pnlPct = ((evalAmount - totalCost) / totalCost) * 100;
  return { totalShares, totalCost, avgPrice, currentPrice, evalAmount, pnlPct, hasLive: !!live };
}

/* ---------- 새 지표 (추가) ---------- */
function liveOf(stock){ return latestPriceData && latestPriceData.stocks && latestPriceData.stocks[stock.code] || null; }
function validNum(n){ return typeof n === 'number' && isFinite(n) && n > 0; }
// 목표가 진행률: (현재가 - 매수가) / (목표가 - 매수가) × 100 — 0~100으로 자르지 않음
function goalProgress(stock, price){
  if (!validNum(stock.entry) || !validNum(stock.finalTP) || !validNum(price)) return null;
  const denom = stock.finalTP - stock.entry;
  if (denom === 0) return { invalid: 'same' };
  if (denom < 0) return { invalid: 'reversed' };
  return { pct: ((price - stock.entry) / denom) * 100 };
}
// 목표가까지 남은 상승률: (목표가 / 현재가 - 1) × 100
function upsideToTP(stock, price){
  if (!validNum(stock.finalTP) || !validNum(price)) return null;
  return (stock.finalTP / price - 1) * 100;
}
function returnPct(stock, price){
  if (!validNum(stock.entry) || !validNum(price)) return null;
  return (price / stock.entry - 1) * 100;
}
function signPct(v, d){ return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d == null ? 1 : d) + '%'; }
function arrow(v){ return v > 0 ? '▲' : v < 0 ? '▼' : '–'; }
function dirClass(v){ return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function marketLabel(stock){
  return { '국내주식':'국내', '국내ETF':'국내 ETF', '해외주식':'해외', '해외ETF':'해외 ETF' }[stock.category] || stock.category;
}

/* ---------- 가설(Thesis) 상태 ---------- */
function hypoOf(code){ return HYPO && HYPO.stocks ? HYPO.stocks.find(s => s.code === code) || null : null; }
function daysUntil(iso){
  if (!iso || iso.startsWith('9999')) return null;
  return dayDiff(kstToday(), iso);
}
function thesisInfo(stock){
  const h = hypoOf(stock.code);
  if (!h) return null;
  const K = h.killCount || HYPO.killCount || 3;
  const broken = h.items.filter(i => i.status === 'bad' && i.kind !== 'price');
  const pending = h.items.filter(i => i.status === 'pending' && !(i.kind === 'price' && i.due.startsWith('9999'))).slice().sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
  const next = pending.find(i => !i.due.startsWith('9999')) || pending[0] || null;
  const live = liveOf(stock);
  const belowKill = typeof h.kill === 'number' && live && live.price < h.kill;
  const sig = signalOf(h, live);
  const floor = floorHit(stock);
  const soon = pending.filter(i => { const d = daysUntil(i.due); return d != null && d <= SOON_DAYS; });
  let level = 'ok';
  if (broken.length >= K) level = 'bad';
  else if (sig.on || floor) level = 'bad';
  else if (broken.length > 0 || belowKill) level = broken.length >= K - 1 ? 'bad' : 'warn';
  else if (soon.length) level = 'warn';
  return { h, K, broken, pending, next, belowKill, sig, floor, soon, level };
}
// 10/20 규칙: 손절선 아래 + 기준일 대비 벤치마크보다 5%p 이상 부진 → 재점검 신호 (붕괴 개수 미포함)
function signalOf(h, live){
  const bi = latestPriceData && latestPriceData.indices && latestPriceData.indices[h.benchmark || 'KOSPI'];
  if (!live || !bi) return { on:false };
  const RU = HYPO.rules || {}, r = HIST && HIST.rel && HIST.rel[h.code] || {};
  const daily = live.change_rate - bi.change_rate, d20 = typeof r.d20 === 'number' ? r.d20 : null;
  const hitD = daily <= (RU.relThreshold || -5), hit20 = d20 != null && d20 <= (RU.rel20Threshold || -10);
  const below = typeof h.kill === 'number' && live.price < h.kill;
  return { on: below && (hitD || hit20), daily, d20, hitD, hit20, gap: hitD ? daily : d20 };
}
function floorHit(stock){
  const l = liveOf(stock); const r = l ? returnPct(stock, l.price) : null;
  const f = (HYPO && HYPO.rules && HYPO.rules.floorPct) || -50;
  return r != null && r <= f ? r : null;
}
function crashDay(){
  const k = latestPriceData && latestPriceData.indices && latestPriceData.indices.KOSPI;
  return k && typeof k.change_rate === 'number' && k.change_rate <= ((HYPO && HYPO.rules && HYPO.rules.crashPct) || -3) ? k : null;
}
function thesisChip(stock){
  const t = thesisInfo(stock);
  if (!t) return `<div class="thesis none">가설 미등록</div>`;
  const icon = t.level === 'bad' ? '✕' : t.broken.length || t.belowKill ? '!' : t.soon.length ? '…' : '✓';
  const sigTxt = t.floor != null ? '마지노선 재점검' : t.sig.on ? '재점검 신호' : null;
  const dSoon = t.soon.length ? daysUntil(t.soon[0].due) : null;
  const label = t.broken.length >= t.K ? '매도 조건 충족' : sigTxt ? sigTxt : t.belowKill ? '손절선 아래(시장 탓)' : t.broken.length ? '가설 훼손' : dSoon != null ? '판정 임박 ' + (dSoon <= 0 ? '오늘' : 'D-' + dSoon) : '가설 유지';
  const nx = t.next ? `다음 판정 ${esc(t.next.when)}` : '남은 판정 없음';
  return `<div class="thesis ${t.level}"><span class="st">${icon} ${label} · 붕괴 ${t.broken.length}/${t.K}</span><span class="nx">${nx}</span></div>`;
}

/* ---------- 카드 ---------- */
function renderCard(stock){

      ${up != null ? (up > 0
        ? `<div class="g num">목표까지 ${signPct(up)}</div>`
        : `<div class="g done num">✓ 목표 도달 ${signPct(-up)} 초과</div>`) : ''}
    </div>` : '';

  let progHTML = '';
  const gp = goalProgress(stock, price);
  if (gp && gp.pct != null){
    const p = gp.pct;
    const cls = p < 0 ? 'under' : p > 100 ? 'over' : '';
    const text = p < 0 ? `매수가 아래 · ${signPct(returnPct(stock, price))}` : p > 100 ? `목표 초과 달성 · ${Math.round(p)}%` : `${Math.round(p)}%`;
    const w = p < 0 ? 0 : Math.min(100, p);
    progHTML = `<div class="prog">
      <div class="prog-top"><span>목표가 진행률</span><b class="num ${cls}">${text}</b></div>
      <div class="bar ${cls}" role="img" aria-label="목표가 진행률 ${Math.round(p)}%"><i style="width:${w}%"></i></div>
      <div class="prog-top"><span class="num">매수 ${fmtPrice(stock, stock.entry)}</span><span class="num">목표 ${fmtPrice(stock, stock.finalTP)}</span></div>
    </div>`;
  } else if (gp && gp.invalid){
    progHTML = `<div class="muted">목표가가 매수가 이하라 진행률을 계산하지 않아요</div>`;
  } else if (hasEntry && stock.finalTP == null){
    const r = returnPct(stock, price);
    progHTML = r != null ? `<div class="ret">매수가 ${fmtPrice(stock, stock.entry)} 대비 <b class="num ${dirClass(r)}">${arrow(r)} ${signPct(r)}</b> · 목표가 미설정</div>` : '';
  } else if (!hasEntry && stock.finalTP == null){
    progHTML = `<div class="ret">미보유 · 목표가 미설정</div>`;
  }

  /* 상세 */
  const r = returnPct(stock, price);
  const asof = isLive && latestPriceData.updated_at
    ? new Date(latestPriceData.updated_at).toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' }) + ' 기준 (' + relativeTimeText(latestPriceData.updated_at) + ')'
    : (priceLoadFailed ? '시세를 불러오지 못해 매수가로 표시 중' : '시세 불러오는 중');
  const kvHTML = `<div class="kv">
      ${hasEntry ? `<div><div class="k">매수가</div><div class="v num">${fmtPrice(stock, stock.entry)}</div></div>` : ''}
      ${r != null && isLive ? `<div><div class="k">매수가 대비</div><div class="v num ${dirClass(r)}">${arrow(r)} ${signPct(r)}</div></div>` : ''}
      <div><div class="k">시세 기준</div><div class="v" style="font-size:14px">${esc(asof)}</div></div>
    </div>`;

  let lineHTML = '';
  if (hasTP && hasEntry){
    const pts = [
      { v: stock.bearTP, k: 'BEAR' }, { v: stock.baseTP, k: 'BASE' }, { v: stock.bullTP, k: 'BULL' }
    ];
    const pp = pos(stock, price);
    const mk = (v, k, extra) => { const L = pos(stock, v); const edge = L < 12 ? ' edge-l' : L > 88 ? ' edge-r' : ''; return `<div class="m${extra||''}${edge}" style="left:${L}%"><span>${k}<br>${short(v, stock.currency)}</span></div>`; };
    lineHTML = `<div>
      <div class="sec-t">BEAR · BASE · BULL 위치 <span class="muted" style="font-weight:400">(매수가 → BULL TP, 기존 기준)</span></div>
      <div class="tpline" role="img" aria-label="BULL TP 진행 위치 ${Math.round(pp)}%">
        <div class="fill" style="width:${pp}%"></div>
        ${pts.map(x => x.v != null ? mk(x.v, x.k) : '').join('')}
        ${stock.finalTP != null ? mk(stock.finalTP, '최종 TP', ' tp') : ''}
        <div class="now" style="left:${pp}%"><span>현재</span></div>
      </div>
      <div class="scen">
        ${['stressed','bear','base','bull','superBull'].map(c => { const v = stock[c+'TP']; if (v == null) return ''; const p = hasEntry ? ((v - stock.entry) / stock.entry * 100) : null;
          return `<div><div class="k">${({stressed:'STRESSED',bear:'BEAR',base:'BASE',bull:'BULL',superBull:'SUPER BULL'})[c]} TP</div><div class="v num">${stock.currency==='USD' ? '$'+v.toLocaleString('en-US') : v.toLocaleString('ko-KR')}</div>${p!=null?`<div class="p num">${p>=0?'+':''}${p.toFixed(1)}%</div>`:''}</div>`; }).join('')}
      </div>
    </div>`;
  } else if (!hasTP){
    lineHTML = `<div class="muted">${hasEntry ? '등록된 목표주가 시나리오 없음 (ETF/현금성 보유)' : '보유하지 않은 관심종목 — 목표주가만 참고용으로 등록됨'}</div>`;
  }

  const t = thesisInfo(stock);
  const thesisHTML = t ? `<div>
      <div class="sec-t">Thesis Check Point <span class="muted" style="font-weight:400">· 기준일 ${esc(HYPO.updated)}</span></div>
      <div class="hlist">
        ${(() => { const sorted = t.h.items.slice().sort((a,b) => { const o = s => s.status === 'bad' ? 0 : s.status === 'pending' ? 1 : 2; return o(a) - o(b) || (a.due < b.due ? -1 : 1); });
          const shown = sorted.filter(i => i.status === 'bad' && i.kind !== 'price').concat(sorted.filter(i => i.status === 'pending').slice(0, 3));
          const rest = sorted.length - shown.length;
          return shown.map(i => `
          <div class="hrow"><span class="tag ${i.kind === 'price' ? 'pend' : i.status === 'bad' ? 'bad' : i.status === 'ok' ? 'ok' : 'pend'}">${i.kind === 'price' ? '주가 신호' : i.status === 'bad' ? '✕ 붕괴' : i.status === 'ok' ? '✓ 유지' : '… 대기'}</span>
          <div><div>${esc(i.title)}${i.gate ? ' <span class="badge">핵심</span>' : ''}</div><div class="w">${esc(i.when)}${i.status === 'pending' && i.rule ? ' · 붕괴: ' + esc(i.rule) : i.result ? ' · ' + esc(i.result) : ''}</div></div></div>`).join('') + (rest > 0 ? `<div class="muted">외 ${rest}개 항목은 가설 보드에서 볼 수 있어요</div>` : ''); })()}
      </div>
    </div>` : '';

  const sellHTML = (hasTP && hasEntry) ? `<div><div class="sec-t">매도 전략</div>
      ${stock.sellNote ? `<div class="note">${stock.sellNote}</div>` : `<div class="note empty">아직 작성된 매도 전략이 없어요.</div>`}</div>` : '';

  const btns = [];
  if (stock.hypoLink) btns.push(`<a class="btn primary" href="${stock.hypoLink}">가설 보드 열기</a>`);
  if (stock.reportLink) btns.push(`<button type="button" class="btn js-frame" data-src="${stock.reportLink}" data-label="종합 리포트">종합 리포트 보기</button><a class="btn" href="${stock.reportLink}" target="_blank" rel="noopener">새 탭 ↗</a>`);
  if (stock.valuationLink) btns.push(`<button type="button" class="btn js-frame" data-tall="1" data-src="${stock.valuationLink}" data-label="적정가 산출근거">적정가 산출근거 보기</button>`);
  const actHTML = btns.length ? `<div><div class="actions">${btns.join('')}</div><div class="frame-wrap"></div></div>` : '';

  return `
  <details class="card" id="card-${esc(stock.code)}" data-code="${esc(stock.code)}">
    <summary>
      <div class="c-head">
        <div>
          <div class="c-name">${esc(stock.name)}</div>
          <div class="c-badges"><span class="badge">${esc(marketLabel(stock))}</span>${stock.watch ? '<span class="badge watch">관심</span>' : ''}<span class="badge num">${esc(stock.code)}</span></div>
        </div>
        <div class="chev" aria-hidden="true">▾</div>
      </div>
      <div class="c-prices">
        <div><div class="c-price num">${price != null ? fmtPrice(stock, price) : '–'}</div>${chgHTML}</div>
        ${tpHTML}
      </div>
      ${progHTML}
      ${t || (hasEntry && stock.category.endsWith('주식')) ? thesisChip(stock) : ''}
    </summary>
    <div class="detail">
      ${kvHTML}
      ${thesisHTML}
      ${lineHTML}
      ${sellHTML}
      ${actHTML}
    </div>
  </details>`;
}

function sortStocks(items, sortMode){
  if (sortMode === 'default') return items;
  const withMetric = items.map(s => {
    let metric = -Infinity;
    if (sortMode === 'daily'){
      const live = latestPriceData && latestPriceData.stocks && latestPriceData.stocks[s.code];
      if (live && typeof live.change_rate === 'number') metric = live.change_rate;
    } else if (sortMode === 'progress'){
      if (s.entry != null && s.bullTP != null){
        const price = currentPriceForStock(s);
        metric = pos(s, price);
      }
    } else if (sortMode === 'goal'){
      const g = goalProgress(s, currentPriceForStock(s));
      if (g && g.pct != null) metric = g.pct;
    }
    return { s, metric };
  });
  withMetric.sort((a, b) => b.metric - a.metric);
  return withMetric.map(x => x.s);
}

function renderBoardInto(containerId, categories, sortMode){
  const board = document.getElementById(containerId);
  const groups = [
    { label:'보유', filter: s => categories.includes(s.category) && s.held },
    { label:'관심 (미보유)', filter: s => categories.includes(s.category) && !s.held },
  ];
  let html = '';
  groups.forEach(g => {
    let items = STOCKS.filter(g.filter);
    if (items.length === 0) return;
    items = sortStocks(items, sortMode);
    html += `<div class="group-h"><span>${g.label}</span><span>${items.length}종목</span></div>`;
    html += `<div class="board">` + items.map(renderCard).join('') + `</div>`;
  });
  board.innerHTML = html || `<div class="empty">등록된 종목이 없어요.</div>`;
}

let dcaChartInstance = null;
let dcaChartMode = 'price';
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function buildDcaChart(){
  const canvas = document.getElementById('dcaChartCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const dateSet = new Set();
  DCA_PLANS.forEach(p => p.purchases.forEach(pu => dateSet.add(pu.date)));
  const todayLabel = latestPriceData && latestPriceData.updated_at ? latestPriceData.updated_at.slice(0,10) : null;
  if (todayLabel) dateSet.add(todayLabel);
  const labels = Array.from(dateSet).sort();
  const titleEl = document.getElementById('dcaChartTitle');
  if (titleEl){
    titleEl.textContent = dcaChartMode === 'price' ? '첫 매수가 대비 가격 흐름' : '그 시점까지의 평균단가 대비 실제 수익률';
  }
  const palette = [cssVar('--accent'), cssVar('--warn')];
  const datasets = DCA_PLANS.map((plan, idx) => {
    const priceByDate = {};
    plan.purchases.forEach(pu => { priceByDate[pu.date] = pu.price; });
    const live = latestPriceData && latestPriceData.stocks && latestPriceData.stocks[plan.code];
    if (live && todayLabel) priceByDate[todayLabel] = live.price;
    let data;
    if (dcaChartMode === 'price'){
      const firstPrice = plan.purchases[0].price;
      data = labels.map(d => priceByDate[d] != null ? ((priceByDate[d] / firstPrice) - 1) * 100 : null);
    } else {
      let cumShares = 0, cumCost = 0;
      const avgCostByDate = {};
      plan.purchases.forEach(pu => { cumShares += pu.shares; cumCost += pu.shares * pu.price; avgCostByDate[pu.date] = cumCost / cumShares; });
      const finalAvgCost = cumCost / cumShares;
      data = labels.map(d => {
        if (avgCostByDate[d] != null) return ((priceByDate[d] / avgCostByDate[d]) - 1) * 100;
        if (d === todayLabel && priceByDate[d] != null) return ((priceByDate[d] / finalAvgCost) - 1) * 100;
        return null;
      });
    }
    return { label: plan.label, data, borderColor: palette[idx % palette.length], backgroundColor: palette[idx % palette.length],
      spanGaps: true, tension: 0.25, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 };
  });
  const tick = cssVar('--muted'), grid = cssVar('--line');
  if (dcaChartInstance) dcaChartInstance.destroy();
  dcaChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels: labels.map(d => d.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: tick, font: { size: 13 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(1) + '%' } }
      },
      scales: {
        x: { ticks: { color: tick, font: { size: 12 } }, grid: { color: grid } },
        y: { ticks: { color: tick, font: { size: 12 }, callback: v => v + '%' }, grid: { color: grid } }
      }
    }
  });
}
function renderDcaBoard(){
  const board = document.getElementById('board-dca');
  const compareEl = document.getElementById('dcaCompare');
  if (!board) return;
  board.innerHTML = `<div class="board">` + DCA_PLANS.map(renderDcaCard).join('') + `</div>`;
  if (compareEl && DCA_PLANS.length === 2){
    const s0 = computeDcaStats(DCA_PLANS[0]);
    const s1 = computeDcaStats(DCA_PLANS[1]);
    const diff = s0.pnlPct - s1.pnlPct;
    const leaderName = diff >= 0 ? DCA_PLANS[0].label : DCA_PLANS[1].label;
    const hasLive = s0.hasLive && s1.hasLive;
    compareEl.innerHTML = `${DCA_PLANS[0].label} <b class="${s0.pnlPct>=0?'up':'down'}">${s0.pnlPct>=0?'+':''}${s0.pnlPct.toFixed(1)}%</b>
      &nbsp;vs&nbsp; ${DCA_PLANS[1].label} <b class="${s1.pnlPct>=0?'up':'down'}">${s1.pnlPct>=0?'+':''}${s1.pnlPct.toFixed(1)}%</b>
      <br>지금까지는 <b>${leaderName}</b>가 ${Math.abs(diff).toFixed(1)}%p 앞서고 있어요${hasLive ? '' : ' (일부 고정값 기준)'}`;
  }
  buildDcaChart();
}

/* ---------- 첫 화면 요약 ---------- */
function goBtn(stock, cls, right){
  return `<button type="button" class="sum-item ${cls}" data-goto="${esc(stock.code)}"><span class="n">${esc(stock.name)}</span><span class="r">${right}</span></button>`;
}
function renderSummary(){
  const el = document.getElementById('summary');
  const held = STOCKS.filter(s => s.held);
  const watch = STOCKS.filter(s => s.watch);
  let gain = 0, loss = 0, counted = 0;
  held.forEach(s => { const l = liveOf(s); const r = l ? returnPct(s, l.price) : null; if (r == null) return; counted++; if (r >= 0) gain++; else loss++; });
  let brokenStocks = 0, hypoStocks = 0;
  STOCKS.forEach(s => { const t = thesisInfo(s); if (!t) return; hypoStocks++; if (t.broken.length) brokenStocks++; });

  const near = [];
  STOCKS.forEach(s => {
    const l = liveOf(s); if (!l) return;
    const up = upsideToTP(s, l.price); if (up == null) return;
    if (up <= 0) near.push({ s, html: goBtn(s, 'ok', `✓ 목표 도달 · ${signPct(-up)} 초과`), k: -1000 + up });
    else if (up <= NEAR_TP_PCT) near.push({ s, html: goBtn(s, '', `목표까지 ${signPct(up)}`), k: up });
  });
  near.sort((a,b) => a.k - b.k);

  const check = [];
  STOCKS.forEach(s => {
    const t = thesisInfo(s); if (!t) return;
    const reasons = []; let score = 0;
    if (t.broken.length >= t.K){ reasons.push('✕ 매도 조건 충족'); score += 100; }
    else if (t.broken.length){ reasons.push(`✕ 붕괴 ${t.broken.length}/${t.K}`); score += 10 * t.broken.length; }
    if (t.sig.on){ reasons.push(`⚠ 재점검 신호 (${t.sig.hitD ? '오늘' : '20거래일'} 시장 대비 ${t.sig.gap.toFixed(1)}%p)`); score += 20; }
    else if (t.belowKill){ reasons.push('손절선 아래 · 시장 탓'); score += 2; }
    if (t.soon.length){ const d = daysUntil(t.soon[0].due); reasons.push(`… 판정 ${d <= 0 ? '오늘' : 'D-' + d}`); score += 1; }
    if (t.floor != null){ reasons.push(`⚠ 마지노선 ${signPct(t.floor)}`); score += 30; }
    if (reasons.length) check.push({ s, score, html: goBtn(s, score >= 20 ? 'bad' : score >= 10 ? 'warn' : '', reasons.join(' · ')) });
  });
  STOCKS.filter(s => s.held && !thesisInfo(s)).forEach(s => { const f = floorHit(s); if (f != null) check.push({ s, score: 30, html: goBtn(s, 'bad', `⚠ 마지노선 ${signPct(f)} · 재점검`) }); });
  check.sort((a,b) => b.score - a.score);
  const cr = crashDay();

  let best = null, worst = null;
  held.forEach(s => { const l = liveOf(s); if (l && typeof l.change_rate === 'number'){ if (!best || l.change_rate > best.r) best = { n: s.name, r: l.change_rate }; if (!worst || l.change_rate < worst.r) worst = { n: s.name, r: l.change_rate }; } });

  const loading = !latestPriceData && !priceLoadFailed;
  el.innerHTML = `
    <div class="sum-stats">
      <div class="stat"><div class="k">보유 / 관심</div><div class="v num">${held.length}<small>/</small>${watch.length}</div></div>
      <div class="stat"><div class="k">수익 / 손실 종목</div><div class="v num">${counted ? `<span class="up">${gain}</span><small>/</small><span class="down">${loss}</span>` : '–'}</div></div>
      <div class="stat"><div class="k">가설 훼손 종목</div><div class="v num">${HYPO ? `${brokenStocks}<small>/ ${hypoStocks}</small>` : '–'}</div></div>
    </div>
    ${cr ? `<div class="err">⚠ 급락일 (코스피 ${cr.change_rate}%) — 오늘은 매도 판단하지 않고 3거래일 뒤로 미뤄요.</div>` : ''}
    ${priceLoadFailed ? `<div class="err">시세를 불러오지 못했어요. 매수가 기준으로 표시하고 있어요.</div>` : ''}
    ${HYPO ? (() => { const t0 = kstToday(), t7 = addDays(t0, 7); const n = scheduleEvents().filter(e => e.i.status === 'pending' && !e.due.startsWith('9999') && e.due >= t0 && e.due <= t7); const g = n.filter(e => e.i.gate).length;
      return `<button type="button" class="sum-item" data-tabgo="schedule"><span class="n">📅 앞으로 7일 판정 ${n.length}건${g ? ` · 핵심 ${g}건` : ''}</span><span class="r">일정 탭에서 보기 →</span></button>`; })() : ''}
    <div class="sum-group">
      <div class="sum-title">⚠ 점검 필요</div>
      ${check.length ? `<div class="sum-list">${check.map(x => x.html).join('')}</div>` : `<div class="sum-empty">${HYPO ? '지금 점검할 가설이 없어요.' : '가설 불러오는 중…'}</div>`}
    </div>
    <div class="sum-group">
      <div class="sum-title">🎯 목표가 임박 (${NEAR_TP_PCT}% 이내)·도달</div>
      ${near.length ? `<div class="sum-list">${near.map(x => x.html).join('')}</div>` : `<div class="sum-empty">${loading ? '시세 불러오는 중…' : `목표가까지 ${NEAR_TP_PCT}% 이내인 종목이 없어요.`}</div>`}
    </div>
    ${best && worst ? `<div class="sum-foot">오늘 베스트 <b class="${dirClass(best.r)}">${esc(best.n)} ${signPct(best.r)}</b> · 워스트 <b class="${dirClass(worst.r)}">${esc(worst.n)} ${signPct(worst.r)}</b></div>` : ''}
    <div class="sum-foot">수익/손실은 매수가 대비 현재가 기준 종목 수예요. 보유 수량 정보가 없어 금액 손익은 표시하지 않아요.</div>`;
}

function relativeTimeText(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  return Math.round(diffHour / 24) + '일 전';
}
function updateIndices(){
  const data = latestPriceData;
  if (!data || !data.indices) return;
  document.querySelectorAll('.idx[data-index]').forEach(chip => {
    const d = data.indices[chip.dataset.index]; if (!d) return;
    chip.querySelector('.v').textContent = Number(d.price).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    const c = chip.querySelector('.c');
    c.textContent = arrow(d.change_rate) + ' ' + signPct(d.change_rate, 2);
    c.className = 'c num ' + dirClass(d.change_rate);
  });
  const fg = data.indices.FEAR_GREED, fgEl = document.querySelector('.idx[data-fg]');
  if (fgEl){
    if (fg && typeof fg.score === 'number'){
      const ko = { 'extreme fear':'극단적 공포', 'fear':'공포', 'neutral':'중립', 'greed':'탐욕', 'extreme greed':'극단적 탐욕' }[String(fg.rating || '').toLowerCase()] || (fg.rating || '');
      fgEl.querySelector('.v').textContent = Math.round(fg.score);
      fgEl.querySelector('.c').textContent = ko + (typeof fg.previous_1_week === 'number' ? ' · 1주 전 ' + Math.round(fg.previous_1_week) : '');
    } else {
      fgEl.querySelector('.c').innerHTML = '<a href="https://www.cnn.com/markets/fear-and-greed" target="_blank" rel="noopener">CNN에서 보기 ↗</a>';
    }
  }
}
function updateAsof(){
  const el = document.getElementById('asof');
  if (latestPriceData && latestPriceData.updated_at){
    el.textContent = '시세 ' + new Date(latestPriceData.updated_at).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) + ' · ' + relativeTimeText(latestPriceData.updated_at);
  } else if (priceLoadFailed){ el.textContent = '시세 불러오기 실패'; }
}

/* ---------- 렌더 & 상호작용 ---------- */

/* ---------- 가설 판정 일정 ---------- */
let calMonth = null; // 'YYYY-MM'
function kstToday(){ return new Date(Date.now() + 9*3600000).toISOString().slice(0,10); }
function dateObj(iso){ return new Date(iso + 'T00:00:00Z'); }
function addDays(iso, n){ const d = dateObj(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function weekStart(iso){ const d = dateObj(iso); const wd = (d.getUTCDay() + 6) % 7; return addDays(iso, -wd); }
function dayDiff(a, b){ return Math.round((dateObj(b) - dateObj(a)) / 86400000); }
const WD = ['일','월','화','수','목','금','토'];
function fmtDay(iso){ const d = dateObj(iso); return `${d.getUTCMonth()+1}/${d.getUTCDate()} (${WD[d.getUTCDay()]})`; }
const KIND_LABEL = { confirmed:'확정일', expected:'예상일', deadline:'기한' };
function scheduleEvents(){
  const ev = [];
  if (!HYPO || !HYPO.stocks) return ev;
  HYPO.stocks.forEach(s => s.items.filter(i => !(i.kind === 'price' && i.due.startsWith('9999'))).forEach(i => ev.push({ s, i, due: i.due, kind: i.dateKind || 'expected' })));
  return ev;
}
function evHTML(e){
  const st = e.i.status;
  const stTag = st === 'bad' ? '<span class="tag bad">✕ 붕괴</span>' : st === 'ok' ? '<span class="tag ok">✓ 유지</span>' : '';
  return `<a class="ev" href="hypothesis.html#${encodeURIComponent(e.s.code)}">
    <div class="t1"><span>${esc(e.s.name)}</span>${e.i.gate ? '<span class="gatebadge">핵심</span>' : ''}<span class="kind ${e.kind}">${KIND_LABEL[e.kind] || '예상일'}</span>${stTag}</div>
    <div class="t2">${esc(e.i.title)}</div>
    <div class="t3">${st === 'pending' ? '붕괴: ' + esc(e.i.rule || '') : esc(e.i.result || '')}</div>
  </a>`;
}
function dayBlock(iso, list, today){
  const dd = dayDiff(today, iso);
  const ddText = dd === 0 ? '오늘' : dd > 0 ? 'D-' + dd : (-dd) + '일 지남';
  const cls = dd < 0 ? 'over' : dd <= 7 ? 'near' : '';
  return `<div class="ag-day" id="d-${iso}"><div class="ag-date"><span>${fmtDay(iso)}</span><span class="dd ${cls}">${ddText}</span></div>${list.map(evHTML).join('')}</div>`;
}
function renderSchedule(){
  const el = document.getElementById('board-schedule');
  if (!el) return;
  if (!HYPO){ el.innerHTML = `<div class="empty">가설 일정을 불러오는 중…</div>`; return; }
  const today = kstToday();
  if (!calMonth) calMonth = today.slice(0,7);
  const all = scheduleEvents();
  const dated = all.filter(e => !e.due.startsWith('9999'));
  const pending = dated.filter(e => e.i.status === 'pending');
  const ongoing = all.filter(e => e.due.startsWith('9999') && e.i.status === 'pending');
  const past = dated.filter(e => e.i.status !== 'pending').sort((a,b) => a.due < b.due ? 1 : -1);

  // 달력
  const [Y, M] = calMonth.split('-').map(Number);
  const first = `${calMonth}-01`;
  const lead = dateObj(first).getUTCDay();
  const days = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  const byDay = {};
  pending.forEach(e => { (byDay[e.due] = byDay[e.due] || []).push(e); });
  let cells = WD.map(w => `<div class="wd">${w}</div>`).join('');
  for (let k = 0; k < lead; k++) cells += `<div class="day out" aria-hidden="true"></div>`;
  for (let d = 1; d <= days; d++){
    const iso = `${calMonth}-${String(d).padStart(2,'0')}`;
    const evs = byDay[iso] || [];
    const dots = evs.slice(0,4).map(e => `<i class="${e.i.gate ? 'gate' : ''}"></i>`).join('');
    cells += evs.length
      ? `<button type="button" class="day has${iso === today ? ' today' : ''}" data-jump="${iso}" aria-label="${M}월 ${d}일 판정 ${evs.length}건">${d}<span class="dots">${dots}</span></button>`
      : `<div class="day${iso === today ? ' today' : ''}">${d}<span class="dots"></span></div>`;
  }
  const monthCount = pending.filter(e => e.due.startsWith(calMonth)).length;

  // 목록 그룹
  const ws = weekStart(today), nws = addDays(ws, 7), nnws = addDays(ws, 14);
  const groups = [];
  const push = (key, title, cls, filter) => {
    const list = pending.filter(filter);
    if (list.length) groups.push({ key, title, cls, list });
  };
  push('over', '기한 지남 · 판정 필요', 'overdue', e => e.due < today);
  push('this', '이번 주', '', e => e.due >= today && e.due < nws);
  push('next', '다음 주', '', e => e.due >= nws && e.due < nnws);
  const later = pending.filter(e => e.due >= nnws);
  const months = [...new Set(later.map(e => e.due.slice(0,7)))].sort();
  months.forEach(m => {
    const [yy, mm] = m.split('-').map(Number);
    push('m' + m, (yy !== Number(today.slice(0,4)) ? yy + '년 ' : '') + mm + '월', '', e => e.due >= nnws && e.due.startsWith(m));
  });
  const groupHTML = groups.map(g => {
    const dates = [...new Set(g.list.map(e => e.due))].sort();
    return `<div class="ag-group"><div class="ag-title ${g.cls}">${g.title}<span>${g.list.length}건</span></div>
      ${dates.map(d => dayBlock(d, g.list.filter(e => e.due === d), today)).join('')}</div>`;
  }).join('');

  const ongoingHTML = ongoing.length ? `<div class="ag-group"><div class="ag-title">상시 감시<span>${ongoing.length}건</span></div>
    <div class="ag-day">${ongoing.map(evHTML).join('')}</div></div>` : '';
  const pastHTML = past.length ? `<details class="past"><summary>지난 판정 ${past.length}건 보기 ▾</summary>
    <div class="agenda">${[...new Set(past.map(e => e.due))].map(d => dayBlock(d, past.filter(e => e.due === d), today)).join('')}</div></details>` : '';

  el.innerHTML = `<div class="agenda">
    <div class="cal">
      <div class="cal-head"><b>${Y}년 ${M}월 <span class="muted" style="font-weight:600">판정 ${monthCount}건</span></b>
        <div class="cal-nav"><button type="button" data-cal="-1" aria-label="이전 달">‹</button><button type="button" data-cal="1" aria-label="다음 달">›</button></div></div>
      <div class="cal-grid">${cells}</div>
      <div class="legend"><span><i></i>판정</span><span><i class="gate"></i>핵심 가설</span><span><span class="kind confirmed">확정일</span>회사 발표일</span><span><span class="kind">예상일</span>추정</span><span><span class="kind deadline">기한</span>마감</span></div>
    </div>
    ${groupHTML || `<div class="empty">남은 판정 일정이 없어요.</div>`}
    ${ongoingHTML}
    ${pastHTML}
    <div class="muted" style="text-align:center">가설 기준일 ${esc(HYPO.updated)} · 예상일은 실적 발표일이 공시되면 확정일로 바뀌어요</div>
  </div>`;
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-cal]');
  if (nav){
    const [y, m] = calMonth.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 1 + Number(nav.dataset.cal), 1));
    calMonth = d.toISOString().slice(0,7);
    renderSchedule();
    return;
  }
  const j = e.target.closest('[data-jump]');
  if (j){
    const t = document.getElementById('d-' + j.dataset.jump);
    if (t){ t.scrollIntoView({ behavior:'smooth', block:'start' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1400); }
    return;
  }
  const tg = e.target.closest('[data-tabgo]');
  if (tg){ activateTab(tg.dataset.tabgo); document.querySelector('.tabs').scrollIntoView({ behavior:'smooth', block:'start' }); }
});

function renderAllBoards(){
  const openCodes = new Set(Array.from(document.querySelectorAll('details.card[open]')).map(d => d.dataset.code || d.dataset.dcaCode).filter(Boolean));
  renderSummary();
  renderBoardInto('board-domestic', ['국내주식','국내ETF'], sortState.domestic);
  renderBoardInto('board-overseas', ['해외주식','해외ETF'], sortState.overseas);
  renderDcaBoard();
  renderClosedBoard();
  renderSchedule();
  document.querySelectorAll('details.card').forEach(d => { const c = d.dataset.code || d.dataset.dcaCode; if (c && openCodes.has(c)) d.open = true; });
  updateIndices();
  updateAsof();
}

function activateTab(name){
  document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === name; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
  if (name === 'dca') requestAnimationFrame(() => { if (dcaChartInstance) dcaChartInstance.resize(); });
}
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => activateTab(btn.dataset.tab)));

document.querySelectorAll('select.sel').forEach(sel => sel.addEventListener('change', () => {
  sortState[sel.dataset.scope] = sel.value;
  renderAllBoards();
}));
document.querySelectorAll('.expand-all').forEach(btn => btn.addEventListener('click', () =>
  btn.closest('.panel').querySelectorAll('details.card').forEach(d => d.open = true)));
document.querySelectorAll('.collapse-all').forEach(btn => btn.addEventListener('click', () =>
  btn.closest('.panel').querySelectorAll('details.card').forEach(d => d.open = false)));

document.querySelectorAll('.dca-chart-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.dca-chart-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  dcaChartMode = btn.dataset.mode;
  buildDcaChart();
}));

document.addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go){
    const stock = STOCKS.find(s => s.code === go.dataset.goto);
    if (!stock) return;
    activateTab(stock.category.startsWith('해외') ? 'overseas' : 'domestic');
    const card = document.getElementById('card-' + stock.code);
    if (card){ card.open = true; card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    return;
  }
  const fb = e.target.closest('.js-frame');
  if (fb){
    const wrap = fb.closest('.actions').parentElement.querySelector('.frame-wrap');
    if (!wrap) return;
    if (fb.dataset.tall) wrap.classList.add('tall');
    if (!wrap.dataset.loaded){
      const iframe = document.createElement('iframe');
      iframe.src = fb.dataset.src;
      iframe.title = fb.dataset.label;
      wrap.appendChild(iframe);
      wrap.dataset.loaded = 'true';
      wrap.style.display = 'block';
      fb.textContent = fb.dataset.label + ' 접기';
    } else {
      const isOpen = wrap.style.display !== 'none';
      wrap.style.display = isOpen ? 'none' : 'block';
      fb.textContent = fb.dataset.label + (isOpen ? ' 보기' : ' 접기');
    }
  }
});

renderAllBoards();

function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(showToast._t); showToast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function loadPrices(manual){
  const btn = document.getElementById('refreshBtn');
  const before = latestPriceData && latestPriceData.updated_at;
  if (btn){ btn.disabled = true; btn.classList.add('busy'); }
  return fetch('./price.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      latestPriceData = data; priceLoadFailed = false; renderAllBoards();
      if (manual){
        const t = new Date(data.updated_at).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
        showToast(before && before === data.updated_at ? `이미 최신이에요 · ${t} 기준 (${relativeTimeText(data.updated_at)})` : `새 시세를 반영했어요 · ${t} 기준`);
      }
    })
    .catch(() => {
      if (!latestPriceData) priceLoadFailed = true;
      console.warn('price.json 로드 실패 — 고정값 표시 중');
      renderAllBoards();
      if (manual) showToast('시세를 불러오지 못했어요. 잠시 후 다시 눌러 주세요');
    })
    .finally(() => { if (btn){ btn.disabled = false; btn.classList.remove('busy'); } });
}
document.getElementById('refreshBtn').addEventListener('click', () => loadPrices(true));
loadPrices(false);

fetch('./hypotheses.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => { HYPO = data; renderAllBoards(); })
  .catch(() => { console.warn('hypotheses.json 로드 실패'); });
fetch('./history.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(data => { if (data){ HIST = data; if (HYPO) renderAllBoards(); } })
  .catch(() => {});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TP TRACKER · 가설 보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* TP TRACKER 새 디자인과 같은 토큰 · 한 열 모바일 */
  :root{
    --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#e1e5eb;
    --fg:#141a22; --muted:#566170; --faint:#8b94a1;
    --accent:#1f6f5c; --accent-soft:#e3f1ec;
    --up:#d6333a; --down:#2f6fe0;
    --ok:#1d8a5a; --ok-soft:#e4f4ec; --warn:#a96a12; --warn-soft:#fbf0dc; --bad:#c62f36; --bad-soft:#fde8e8;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1115; --surface:#171b21; --surface-2:#1f242c; --line:#2a3039;
    --fg:#e9edf2; --muted:#a6b0bc; --faint:#717c89;
    --accent:#4fb79f; --accent-soft:#16302a;
    --up:#ff5f64; --down:#5d9cff;
    --ok:#43c08a; --ok-soft:#15302a; --warn:#e5a845; --warn-soft:#352a17; --bad:#ff6b70; --bad-soft:#3a1d20;
    color-scheme: dark; } }
  :root[data-theme="dark"]{
    --bg:#0e1115; --surface:#171b21; --surface-2:#1f242c; --line:#2a3039;
    --fg:#e9edf2; --muted:#a6b0bc; --faint:#717c89;
    --accent:#4fb79f; --accent-soft:#16302a;
    --up:#ff5f64; --down:#5d9cff;
    --ok:#43c08a; --ok-soft:#15302a; --warn:#e5a845; --warn-soft:#352a17; --bad:#ff6b70; --bad-soft:#3a1d20;
    color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.5; padding-inline:16px; padding-block:calc(16px + env(safe-area-inset-top,0px)) 56px; -webkit-text-size-adjust:100%; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .wrap{ max-width:680px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  .mono{ font-variant-numeric:tabular-nums; }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .back{ display:inline-flex; align-items:center; min-height:44px; font-size:15px; font-weight:600; text-decoration:none; color:var(--muted); }

  header{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand{ font-size:20px; font-weight:800; }
  .brand b{ color:var(--accent); font-weight:800; }
  .stamp{ font-size:13px; color:var(--faint); text-align:right; line-height:1.5; }

  .tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; min-height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .tab.active{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .tab .cnt{ font-size:13px; margin-left:6px; font-variant-numeric:tabular-nums; opacity:.8; }
  .tab .cnt.hot{ color:var(--bad); opacity:1; }
  .tab.active .cnt.hot{ color:var(--bad-soft); }

  .panel{ background:var(--surface); border-radius:16px; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; min-width:0; }
  .ptitle{ font-size:14px; font-weight:700; color:var(--muted); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .ptitle span:last-child{ font-weight:500; color:var(--faint); font-size:13px; }

  .g-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .g-big{ font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .g-big small{ font-size:15px; color:var(--muted); font-weight:500; }
  .slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .slot{ height:36px; border-radius:10px; background:var(--surface-2); display:grid; place-items:center; font-size:13px; color:var(--faint); }
  .slot.on{ background:var(--bad-soft); color:var(--bad); font-weight:700; }
  .verdict{ padding:12px 14px; border-radius:10px; font-size:15px; font-weight:600; }
  .v-ok{ color:var(--ok); background:var(--ok-soft); }
  .v-warn{ color:var(--warn); background:var(--warn-soft); }
  .v-bad{ color:var(--bad); background:var(--bad-soft); }

  .px-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .px{ font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
  .chg{ font-size:15px; font-weight:600; margin-left:8px; font-variant-numeric:tabular-nums; }
  .chg.up{ color:var(--up); } .chg.down{ color:var(--down); }
  .rail{ position:relative; height:8px; border-radius:999px; background:var(--surface-2); margin:30px 6px 30px; }
  .pin{ position:absolute; top:-5px; width:2px; height:18px; }
  .pin span{ position:absolute; white-space:nowrap; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .pin.kill{ background:var(--bad); } .pin.kill span{ top:22px; left:0; color:var(--bad); font-weight:600; }
  .pin.goal{ background:var(--ok); } .pin.goal span{ top:22px; right:0; color:var(--ok); font-weight:600; }
  .pin.now{ width:14px; height:14px; top:-3px; margin-left:-7px; background:var(--fg); border:3px solid var(--surface); border-radius:50%; }
  .pin.now span{ bottom:16px; left:50%; transform:translateX(-50%); color:var(--fg); font-weight:700; }
  .note{ font-size:14px; color:var(--muted); }
  .alert{ font-size:14px; color:var(--bad); font-weight:700; background:var(--bad-soft); padding:10px 12px; border-radius:10px; }

  .item{ display:grid; grid-template-columns:88px minmax(0,1fr); gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  .item:first-child{ border-top:0; padding-top:2px; }
  .when{ font-size:13px; color:var(--muted); font-weight:600; padding-top:2px; }
  .when.soon{ color:var(--accent); }
  .ib{ min-width:0; display:grid; gap:4px; }
  .it{ font-weight:700; font-size:15.5px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .gate{ font-size:12px; color:var(--accent); background:var(--accent-soft); padding:1px 8px; border-radius:999px; font-weight:700; }
  .rule{ font-size:14px; color:var(--muted); }
  .src{ font-size:12.5px; color:var(--faint); }
  .badge{ font-size:12.5px; padding:2px 9px; border-radius:999px; font-weight:700; justify-self:start; }
  .b-ok{ color:var(--ok); background:var(--ok-soft); }
  .b-bad{ color:var(--bad); background:var(--bad-soft); }
  .b-pending{ color:var(--muted); background:var(--surface-2); }

  .roe-top{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .roe-big{ font-size:28px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .tw{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums; }
  th, td{ padding:9px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; }
  th{ color:var(--muted); font-weight:600; font-size:13px; }
  tr.avg td{ font-weight:800; border-bottom:0; }
  .bear{ color:var(--bad); } .base{ color:var(--down); } .bull{ color:var(--ok); }
  .err{ background:var(--warn-soft); color:var(--warn); padding:14px; border-radius:12px; font-size:14px; }
  .foot{ font-size:13px; color:var(--faint); text-align:center; }
  @media (max-width:380px){ .item{ grid-template-columns:72px minmax(0,1fr); gap:10px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← TP TRACKER</a>
  <header>
    <div class="brand"><b>TP</b> TRACKER · 가설</div>
    <div class="stamp" id="stamp">불러오는 중...</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
  <p class="foot">붕괴는 누적으로 세고, 종목마다 정한 개수가 쌓이면 규칙대로 전량 매도 · 가설 상태는 hypotheses.json에서 수정</p>
</div>

<script>
(function(){
  var H = null, P = null, cur = null;

  function won(n){ return n.toLocaleString('ko-KR') + '원'; }
  function man(n){ return (n/10000).toLocaleString('ko-KR', {maximumFractionDigits:1}) + '만'; }
  var USD = false;
  function big(n){ return USD ? '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : won(n); }
  function short(n){ return USD ? '$' + n.toLocaleString('en-US', {maximumFractionDigits:2}) : man(n); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function kst(iso){
    try { return new Date(iso).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }
  function brokenOf(s){ return s.items.filter(function(i){ return i.status === 'bad'; }).length; }

  function renderTabs(){
    document.getElementById('tabs').innerHTML = H.stocks.map(function(s){
      var KK = s.killCount || H.killCount, b = brokenOf(s), hot = b >= KK - 1;
      return '<button class="tab' + (s.code === cur ? ' active' : '') + '" data-code="' + s.code + '">' + esc(s.name) +
        '<span class="cnt' + (hot ? ' hot' : '') + '">' + b + '/' + KK + '</span></button>';
    }).join('');
  }

  function render(){
    var s = H.stocks.filter(function(x){ return x.code === cur; })[0];
    if (!s) return;
    USD = s.currency === 'USD';
    renderTabs();
    var K = s.killCount || H.killCount, b = brokenOf(s), left = Math.max(0, K - b);
    var pending = s.items.filter(function(i){ return i.status === 'pending'; })
      .sort(function(a, c){ return a.due < c.due ? -1 : a.due > c.due ? 1 : 0; });
    var done = s.items.filter(function(i){ return i.status !== 'pending'; })
      .sort(function(a, c){ return a.due < c.due ? 1 : -1; });
    var gateBad = s.items.filter(function(i){ return i.gate && i.status === 'bad'; }).length;

    var slots = '';
    for (var k = 0; k < K; k++) slots += '<div class="slot' + (k < b ? ' on' : '') + '">' + (k < b ? '붕괴' : '—') + '</div>';
    var vc = b >= K ? 'v-bad' : left === 1 ? 'v-warn' : 'v-ok';
    var vt = b >= K ? '매도 조건 충족 — 규칙대로 전량 매도' :
      left === 1 ? '한 개만 더 깨지면 전량 매도 · 다음 판정 ' + (pending[0] ? pending[0].when + ' ' + pending[0].title : '') :
      '여유 ' + left + '칸 · 계속 보유 가능';
    if (gateBad >= 2) vt += ' · 핵심 가설 2개 붕괴, 즉시 재검토';

    var html = '';
    html += '<section class="panel"><div class="ptitle"><span>매도까지</span><span>판정 끝 ' + done.length + ' · 남은 판정 ' + pending.length + '</span></div>' +
      '<div class="g-head"><div class="g-big">' + b + ' <small>/ ' + K + ' 붕괴</small></div></div>' +
      '<div class="slots" style="grid-template-columns:repeat(' + K + ',1fr)">' + slots + '</div><div class="verdict ' + vc + '">' + esc(vt) + '</div></section>';

    var q = P && P.stocks && P.stocks[s.code];
    if (q){
      var hasKill = typeof s.kill === 'number';
      var min = Math.min(hasKill ? s.kill : q.price, q.price) * 0.9, max = Math.max(s.goal, q.price) * 1.05;
      var pos = function(v){ return Math.max(0, Math.min(100, (v - min) / (max - min) * 100)); };
      var toKill = hasKill ? (q.price - s.kill) / q.price * 100 : null;
      var cls = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      var sign = q.change > 0 ? '+' : '';
      html += '<section class="panel"><div class="ptitle"><span>주가 위치</span><span>' + (P.domestic_updated_at || P.updated_at ? kst(P.domestic_updated_at || P.updated_at) + ' 기준' : '') + '</span></div>' +
        '<div class="px-row"><div><span class="px">' + big(q.price) + '</span><span class="chg ' + cls + '">' + sign + q.change_rate + '%</span></div>' +
        (hasKill ? '<div class="note">손절선까지 <b class="mono">' + (toKill >= 0 ? '-' + toKill.toFixed(1) + '%' : '이미 하회') + '</b></div>' : '<div class="note">주가 손절선 없음</div>') + '</div>' +
        '<div class="rail" aria-hidden="true">' + (hasKill ? '<div class="pin kill" style="left:' + pos(s.kill) + '%"><span>손절 ' + short(s.kill) + '</span></div>' : '') +
        '<div class="pin goal" style="left:' + pos(s.goal) + '%"><span>목표 ' + short(s.goal) + '</span></div>' +
        '<div class="pin now" style="left:' + pos(q.price) + '%"><span>' + short(q.price) + '</span></div></div>' +
        (hasKill && q.price < s.kill ? '<div class="alert">⚠ 현재가가 손절선 아래예요. 종가 기준 2주 이어지는지 확인하세요.</div>' : '') +
        '<div class="note">' + esc(s.priceNote) + '</div></section>';
    }

    html += '<section class="panel"><div class="ptitle"><span>다음 판정</span><span>가까운 순</span></div><div>' +
      pending.map(function(i, n){
        return '<div class="item"><div class="when' + (n < 2 ? ' soon' : '') + '">' + esc(i.when) + '</div><div class="ib">' +
          '<div class="it">' + esc(i.title) + (i.gate ? '<span class="gate">핵심</span>' : '') + '</div>' +
          '<div class="rule">붕괴: ' + esc(i.rule) + '</div><div class="src">' + esc(i.src) + '</div></div></div>';
      }).join('') + '</div></section>';

    if (done.length) html += '<section class="panel"><div class="ptitle"><span>판정 끝난 가설</span><span>붕괴는 그대로 이월</span></div><div>' +
      done.map(function(i){
        return '<div class="item"><div class="when">' + esc(i.when) + '</div><div class="ib">' +
          '<span class="badge ' + (i.status === 'bad' ? 'b-bad">붕괴' : 'b-ok">유지') + '</span>' +
          '<div class="it">' + esc(i.title) + '</div><div class="rule">' + esc(i.result) + '</div><div class="src">' + esc(i.src) + '</div></div></div>';
      }).join('') + '</div></section>';

    if (s.roe){
      var R = s.roe, av = [1,2,3].map(function(c){ var t = 0; R.rows.forEach(function(r){ t += r[c]; }); return t / R.rows.length; });
      var W = R.weights, ex = W ? (av[0]*W[0] + av[1]*W[1] + av[2]*W[2]) / 100 : av[1];
      var span = R.rows[0][0].slice(0,4) + '~' + R.rows[R.rows.length-1][0].slice(0,4);
      html += '<section class="panel"><div class="ptitle"><span>ROE 시나리오 ' + span + '</span><span>' + esc(R.prev) + '</span></div>' +
        '<div class="roe-top"><span class="roe-big">' + ex.toFixed(1) + '%</span><span class="note">' + (W ? '확률가중 평균' : 'Base 평균 (확률 미설정)') + '</span></div>' +
        '<div class="tw"><table><thead><tr><th></th><th>Bear' + (W ? ' ' + W[0] + '%' : '') + '</th><th>Base' + (W ? ' ' + W[1] + '%' : '') + '</th><th>Bull' + (W ? ' ' + W[2] + '%' : '') + '</th></tr></thead><tbody>' +
        R.rows.map(function(r){ return '<tr><td>' + r[0] + '</td><td class="bear">' + r[1] + '%</td><td class="base">' + r[2] + '%</td><td class="bull">' + r[3] + '%</td></tr>'; }).join('') +
        '<tr class="avg"><td>평균</td><td class="bear">' + av[0].toFixed(1) + '%</td><td class="base">' + av[1].toFixed(1) + '%</td><td class="bull">' + av[2].toFixed(1) + '%</td></tr>' +
        '</tbody></table></div></section>';
    }
    document.getElementById('main').innerHTML = '<div class="wrap" style="padding:0">' + html + '</div>';
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if (!t) return;
    cur = t.dataset.code; history.replaceState(null, '', '#' + cur); render();
  });

  var bust = '?t=' + Date.now();
  Promise.all([
    fetch('./hypotheses.json' + bust).then(function(r){ if (!r.ok) throw new Error('hypotheses.json ' + r.status); return r.json(); }),
    fetch('./price.json' + bust).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
  ]).then(function(res){
    H = res[0]; P = res[1];
    var want = (location.hash || '').replace('#', '');
    cur = H.stocks.some(function(s){ return s.code === want; }) ? want : H.stocks[0].code;
    document.getElementById('stamp').innerHTML = '가설 기준 ' + esc(H.updated) + '<br>' + (P ? '시세 ' + kst(P.domestic_updated_at || P.updated_at) : '시세 불러오기 실패');
    render();
  }).catch(function(err){
    document.getElementById('stamp').textContent = '오류';
    document.getElementById('main').innerHTML = '<div class="err">hypotheses.json을 불러오지 못했어요 (' + esc(err.message) + '). 파일이 index.html과 같은 위치에 올라갔는지 확인해 주세요.</div>';
  });
})();
</script>
</body>
</html>
